<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rauschwerks Techno Prompt Generator</title>
    <style>
        :root { --neon: #00ff66; --accent: #ff0055; --cyan: #00e5ff; --bg: #060608; --panel: #111116; }
        body { font-family: 'Consolas', 'Courier New', monospace; background: var(--bg); color: var(--neon); padding: 20px; max-width: 980px; margin: auto; }
        h1 { text-transform: uppercase; border-bottom: 2px solid var(--neon); padding-bottom: 10px; text-shadow: 0 0 12px var(--neon); display: flex; justify-content: space-between; align-items: center; }
        h1 span { font-size: 0.8rem; color: var(--accent); border: 1px solid var(--accent); padding: 3px 8px; border-radius: 4px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 750px) { .grid { grid-template-columns: 1fr; } }
        
        .card { background: var(--panel); padding: 15px; border-radius: 6px; border: 1px solid #222; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #fff; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        select, input[type="text"], input[type="range"] { width: 100%; padding: 10px; margin-top: 5px; background: #08080a; color: var(--neon); border: 1px solid #333; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        
        .title-group { display: flex; gap: 10px; margin-top: 5px; }
        .title-group input { flex: 1; margin-top: 0; }
        .title-group select { width: 130px; margin-top: 0; }
        
        .bpm-val { float: right; color: var(--accent); font-weight: bold; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        button { flex: 1; padding: 12px; background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; border-radius: 4px; font-size: 0.8rem; transition: 0.2s; min-width: 140px; }
        button:hover { background: #00cc52; box-shadow: 0 0 15px var(--neon); }
        button.secondary { background: #1a1a22; color: var(--neon); border: 1px solid var(--neon); }
        button.secondary:hover { background: var(--neon); color: #000; }
        button.cyan { background: #1a1a22; color: var(--cyan); border: 1px solid var(--cyan); }
        button.cyan:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }
        button.accent { background: #1a1a22; color: var(--accent); border: 1px solid var(--accent); }
        button.accent:hover { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent); }
        button.small { padding: 8px 12px; font-size: 0.75rem; background: #222; color: var(--neon); border: 1px solid #444; }

        .timeline { display: flex; gap: 5px; margin-top: 10px; }
        .time-block { flex: 1; background: #181820; border: 1px solid #333; padding: 8px 4px; text-align: center; border-radius: 4px; font-size: 0.7rem; color: #aaa; cursor: pointer; }
        .time-block.active { border-color: var(--cyan); color: var(--cyan); background: #0e1e24; }

        .canvas-container { margin-top: 10px; background: #000; border: 1px solid #333; border-radius: 4px; overflow: hidden; height: 50px; }
        canvas { width: 100%; height: 100%; display: block; }

        .output-container { margin-top: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 750px) { .output-container { grid-template-columns: 1fr; } }
        
        .output-box { padding: 15px; background: #000; border: 1px solid var(--neon); border-radius: 6px; box-shadow: inset 0 0 10px rgba(0,255,102,0.1); position: relative; }
        .output-title { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-bottom: 8px; }
        .output-content { color: #fff; word-break: break-word; font-size: 0.95rem; line-height: 1.4; min-height: 80px; white-space: pre-line; }
        
        .copy-btn { background: var(--accent); color: #fff; border: none; padding: 6px 10px; font-size: 0.7rem; font-weight: bold; cursor: pointer; border-radius: 4px; float: right; text-transform: uppercase; margin-top: -5px; }
        .copy-btn:hover { background: #d00045; box-shadow: 0 0 10px var(--accent); }
    </style>
</head>
<body>

    <h1>Rauschwerks Techno Prompt Generator <span>v13 PRO</span></h1>

    <div class="card">
        <label>Track Title Generator</label>
        <div class="title-group">
            <input type="text" id="trackTitle" placeholder="Titel eingeben..." oninput="generatePrompt()">
            <select id="titleLang" onchange="generateRandomLyrics()">
                <option value="de">Deutsch 🇩🇪</option>
                <option value="en" selected>English 🇬🇧</option>
                <option value="es">Español 🇪🇸</option>
                <option value="fr">Français 🇫🇷</option>
            </select>
            <button class="small" onclick="generateRandomTitle()">🎲 Titel</button>
        </div>
    </div>

    <!-- NEU: Location, Vibe & Track-Länge -->
    <div class="card" style="border-color: var(--accent);">
        <label for="locationVibe" style="color: var(--accent);">Location & Vibe Profile</label>
        <select id="locationVibe" onchange="generatePrompt()">
            <option value="Mainstage Festival Peak-Time, massive stadium reverb, huge crowd energy">🎆 Festival Mainstage (Widescreen Anthems)</option>
            <option value="Dark underground bunker club, industrial acoustics, sweaty intimate atmosphere">🏭 Dark Underground Bunker Club (Raw & Sweaty)</option>
            <option value="Open Air daytime stage, warm sunshine vibe, euphoric rolling rhythm">☀️ Open Air / Daytime Rave (Groovy & Uplifting)</option>
            <option value="Afterhour basement at 7 AM, hypnotic repetitive trance, deep rolling bass">🌙 Afterhour / Sunrise Basement (Hypnotic & Deep)</option>
            <option value="Warehouse rave, massive concrete walls, high-pressure sound system">🏗️ Industrial Warehouse (Raw & Punchy)</option>
        </select>

        <label for="trackDuration">Target Track Length & Structure Style</label>
        <select id="trackDuration" onchange="generatePrompt()">
            <option value="Full length extended club mix (6-8 minutes), gradual hypnotic progression">Extended Club Mix (6-8 Min)</option>
            <option value="Standard festival edit (3-4 minutes), fast hitting structure, quick drops">Standard Festival Edit (3-4 Min)</option>
            <option value="Short radio / streaming cut (2-2:30 minutes), immediate impact">Short Streaming Cut (2-2:30 Min)</option>
            <option value="DJ tool loop intro/outro-friendly mix (5 minutes)">DJ Tool / Extended Loop Mix (5 Min)</option>
        </select>
    </div>

    <div class="card" style="border-color: var(--cyan);">
        <label for="artistStyle" style="color: var(--cyan);">DJ Signature Presets (Trance bis Schranz)</label>
        <select id="artistStyle" onchange="applyArtistPreset()">
            <option value="custom">-- Custom Selection --</option>
            <optgroup label="Trance-Techno & Euro-Trance (Bouncy)">
                <option value="marlon">Marlon Hoffstadt / DJ Daddy Trance (Bouncy Euro-Trance)</option>
                <option value="malugi">MALUGI (Groovy Trance & House Energy)</option>
                <option value="darrenstyles">Darren Styles / Hard Trance Vibe (High Energy Anthems)</option>
                <option value="isokib">I_o Style (Dark Progressive Trance & Techno)</option>
            </optgroup>
            <optgroup label="Hard Trance & Rave & Neo-Trance">
                <option value="horsegiirL">horsegiirL (Bouncy Horse-Trance & Techno)</option>
                <option value="badboombox">Bad Boombox (Sexy Trance & Ghetto Tech Groove)</option>
                <option value="aze">AZYR (Fast Rave & Hard Trance Fusion)</option>
                <option value="ceraounun">Cera Khin / Fast Rave Trance</option>
            </optgroup>
            <optgroup label="Hardgroove & Tribal Techno">
                <option value="carlcox">Carl Cox (Classic Peak Techno Groove)</option>
                <option value="benwal">Benwal (Bouncy Hardgroove & House)</option>
                <option value="dvs1">DVS1 (Deep Rolling Groove & Hypnotic Floor)</option>
                <option value="partiboi69">Partiboi69 (Ghetto Funk & Raw 909 Groove)</option>
            </optgroup>
            <optgroup label="Schranz, Hard & Industrial">
                <option value="klangkuenstler">Klangkuenstler (155 BPM Schranz & Industrial)</option>
                <option value="nicomoreno">Nico Moreno (Aggressive Hard Kick Slap)</option>
                <option value="saralandry">Sara Landry (High-Energy Acid Hard Techno)</option>
                <option value="russell">Rush / Pierre (Classic German Schranz & Loop-Techno)</option>
                <option value="brakka">Brakka / Hard Schranzcore</option>
            </optgroup>
        </select>
    </div>

    <div class="grid">
        <div class="card">
            <label for="targetAI">Target AI Engine</label>
            <select id="targetAI" onchange="generatePrompt()">
                <option value="suno">Suno AI (Style Tags & Lyrics Format)</option>
                <option value="udio">Udio (Descriptive Text Prompt)</option>
                <option value="midjourney">Midjourney (Cover Art Prompt)</option>
            </select>

            <label for="genre">Subgenre</label>
            <select id="genre" onchange="generatePrompt()">
                <option value="Fast Euro-Trance Techno">Fast Euro-Trance Techno</option>
                <option value="Hard Trance & Rave">Hard Trance & Rave</option>
                <option value="Bouncy Hardgroove">Bouncy Hardgroove</option>
                <option value="Hard Techno">Hard Techno</option>
                <option value="Schranz Hard Groove">Schranz / Hard Groove</option>
                <option value="Raw Hypnotic Techno">Raw / Hypnotic Techno</option>
                <option value="Melodic Techno">Melodic Techno</option>
            </select>

            <label>Tempo: <span id="bpmDisplay" class="bpm-val">150 BPM</span></label>
            <input type="range" id="bpm" min="120" max="180" value="150" oninput="updateBPM()">

            <label for="key">Tonart / Key</label>
            <select id="key" onchange="generatePrompt()">
                <option value="F minor">F Minor</option>
                <option value="A minor">A Minor</option>
                <option value="C minor">C Minor</option>
                <option value="D minor">D Minor</option>
                <option value="E minor">E Minor</option>
            </select>
        </div>

        <div class="card">
            <label for="synthEngine">Synthesizer Sound Engine</label>
            <select id="synthEngine">
                <option value="sawtooth">303 Acid Sawtooth (Screaming Resonance)</option>
                <option value="square">303 Acid Square Wave (Hollow Punch)</option>
                <option value="trancelead">Super-Saw Trance Lead (Wailing Anthem)</option>
                <option value="rumble">Sub-Rumble Heavy Bass Kick</option>
                <option value="moog">Analogue Moog Bass (Warm Fat Drive)</option>
                <option value="fm">FM Pluck Synth (Metallic Sharp Edge)</option>
            </select>

            <label for="drums">Drums & Percussion Kit</label>
            <select id="drums" onchange="generatePrompt()">
                <option value="bouncy euro-trance 909 kick, fast offbeat bassline, snappy snares">Euro-Trance Bounce & Snare</option>
                <option value="hardgroove rolling kick drum, tribal percussion loops, driving ride cymbals">Hardgroove Tribal & Ride</option>
                <option value="heavy distorted 909 kick drum, aggressive rolling sub-bass, fast offbeat hi-hats">Hard 909 & Rolling Sub</option>
                <option value="ultra distorted schranz kick, fast loop-percussion, aggressive noise hats">Schranz Loop Kick & Noise</option>
                <option value="industrial metal percussion, distorted snare hits, anvil impacts">Industrial Metal & Anvils</option>
            </select>

            <label for="synths">Lead & Dynamic Synth Textures</label>
            <select id="synths" onchange="generatePrompt()">
                <option value="euphoric wide super-saw trance arpeggiator, uplifting melodic pads">Euphoric Trance Arp & Pads</option>
                <option value="screaming TB-303 acid lead with resonance sweeps">Screaming TB-303 Acid</option>
                <option value="groovy filtered chord stabs, rhythmic house-techno keys">Groovy Filtered Chords</option>
                <option value="dark dystopian supersaw stabs, detuned lead synths">Detuned Supersaw Stabs</option>
                <option value="hypnotic minor plucks, fast delayed synth riffs">Hypnotic Minor Plucks</option>
            </select>

            <label for="vocals">Vocal Style & Mode</label>
            <select id="vocals" onchange="generatePrompt()">
                <option value="none">Keine Vocals (Instrumental)</option>
                <option value="euphoric female trance choir vocals, soaring emotional hooks">Euphoric Female Trance Vocals</option>
                <option value="dark robotic vocal chants, hypnotic spoken words">Robotic Vocal Chants</option>
                <option value="deep German male spoken word monologue about Berlin nightlife">German Deep Male Vocal</option>
            </select>
        </div>
    </div>

    <div class="card">
        <label style="color: var(--cyan);">Track Arrangement & Timeline</label>
        <div class="timeline">
            <div class="time-block active" onclick="toggleArrangerBlock(this)">[Intro]</div>
            <div class="time-block active" onclick="toggleArrangerBlock(this)">[Build-Up]</div>
            <div class="time-block active" onclick="toggleArrangerBlock(this)">[Main Drop]</div>
            <div class="time-block active" onclick="toggleArrangerBlock(this)">[Breakdown]</div>
            <div class="time-block active" onclick="toggleArrangerBlock(this)">[Peak Drop]</div>
            <div class="time-block active" onclick="toggleArrangerBlock(this)">[Outro]</div>
        </div>
    </div>

    <div class="card" style="border-color: var(--neon);">
        <label style="color: var(--neon);">Audio Preview & Visualizer</label>
        <div class="canvas-container">
            <canvas id="visualizer"></canvas>
        </div>
        <div class="btn-group">
            <button class="cyan" onclick="toggleAudioPreview()" id="audioBtn">▶️ Play Audio Beat</button>
            <button class="accent" onclick="exportMIDI()">🎹 Export MIDI File (.mid)</button>
        </div>
    </div>

    <div class="btn-group">
        <button onclick="generatePrompt()">Prompt Generieren</button>
        <button class="secondary" onclick="randomizeAll()">🎲 Alles Zufällig</button>
    </div>

    <div class="output-container">
        <div class="output-box">
            <button class="copy-btn" onclick="copyText('output-style', this)">Kopieren</button>
            <div class="output-title">Style & Music Prompt:</div>
            <div id="output-style" class="output-content">Wähle deine Optionen...</div>
        </div>

        <div class="output-box">
            <button class="copy-btn" onclick="copyText('output-lyrics', this)">Kopieren</button>
            <div class="output-title">Arranged Lyrics & Tags:</div>
            <div id="output-lyrics" class="output-content">[Instrumental]</div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let timerId = null;
        let stepIndex = 0;
        let analyser = null;
        let canvas, canvasCtx;

        const acidNotes = [110, 110, 220, 110, 165, 110, 220, 130, 110, 110, 330, 110, 165, 220, 110, 147];

        const lyricDatabase = {
            de: ["\nDie Frequenz übernimmt die Kontrolle.\nIm Dunkeln verlieren wir die Zeit.\n\n[Drop]\nBass. Druck. Ekstase."],
            en: ["\nLost inside the hypnotic frequency.\nWe belong to the shadows of the club.\n\n[Drop]\nDon't stop the bass."],
            es: ["\nLa frecuencia toma el control.\nPerdemos la noción del tiempo en la oscuridad.\n\n[Drop]\nBajo. Presión. Éxtasis."],
            fr: ["\nLa fréquence prend le contrôle.\nNous nous perdons dans l'obscurité de la nuit.\n\n[Drop]\nBasse. Pression. Extase."]
        };

        const artistPresets = {
            marlon: { genre: "Fast Euro-Trance Techno", bpm: 145, key: "D minor", synthEngine: "trancelead", drums: "bouncy euro-trance 909 kick, fast offbeat bassline, snappy snares", synths: "euphoric wide super-saw trance arpeggiator, uplifting melodic pads", vocals: "euphoric female trance choir vocals, soaring emotional hooks", artistTag: "Marlon Hoffstadt DJ Daddy Trance bouncy euro-trance style" },
            malugi: { genre: "Fast Euro-Trance Techno", bpm: 142, key: "A minor", synthEngine: "square", drums: "bouncy euro-trance 909 kick, fast offbeat bassline, snappy snares", synths: "groovy filtered chord stabs, rhythmic house-techno keys", vocals: "none", artistTag: "MALUGI groovy trance house style" },
            darrenstyles: { genre: "Hard Trance & Rave", bpm: 150, key: "E minor", synthEngine: "trancelead", drums: "bouncy euro-trance 909 kick, fast offbeat bassline, snappy snares", synths: "euphoric wide super-saw trance arpeggiator, uplifting melodic pads", vocals: "euphoric female trance choir vocals, soaring emotional hooks", artistTag: "Darren Styles uplifting hard trance anthem style" },
            isokib: { genre: "Hard Trance & Rave", bpm: 138, key: "C minor", synthEngine: "sawtooth", drums: "heavy distorted 909 kick drum, aggressive rolling sub-bass, fast offbeat hi-hats", synths: "dark dystopian supersaw stabs, detuned lead synths", vocals: "none", artistTag: "I_o dark progressive trance techno style" },
            horsegiirL: { genre: "Hard Trance & Rave", bpm: 148, key: "A minor", synthEngine: "trancelead", drums: "bouncy euro-trance 909 kick, fast offbeat bassline, snappy snares", synths: "euphoric wide super-saw trance arpeggiator, uplifting melodic pads", vocals: "euphoric female trance choir vocals, soaring emotional hooks", artistTag: "horsegiirL bouncy horse-trance style" },
            badboombox: { genre: "Hard Trance & Rave", bpm: 144, key: "D minor", synthEngine: "square", drums: "bouncy euro-trance 909 kick, fast offbeat bassline, snappy snares", synths: "groovy filtered chord stabs, rhythmic house-techno keys", vocals: "dark robotic vocal chants, hypnotic spoken words", artistTag: "Bad Boombox sexy ghetto tech trance style" },
            aze: { genre: "Hard Techno", bpm: 156, key: "E minor", synthEngine: "sawtooth", drums: "heavy distorted 909 kick drum, aggressive rolling sub-bass, fast offbeat hi-hats", synths: "screaming TB-303 acid lead with resonance sweeps", vocals: "dark robotic vocal chants, hypnotic spoken words", artistTag: "AZYR fast rave hard trance techno style" },
            ceraounun: { genre: "Hard Trance & Rave", bpm: 150, key: "F minor", synthEngine: "trancelead", drums: "heavy distorted 909 kick drum, aggressive rolling sub-bass, fast offbeat hi-hats", synths: "euphoric wide super-saw trance arpeggiator, uplifting melodic pads", vocals: "none", artistTag: "Cera Khin fast rave hard trance style" },
            carlcox: { genre: "Bouncy Hardgroove", bpm: 130, key: "A minor", synthEngine: "moog", drums: "hardgroove rolling kick drum, tribal percussion loops, driving ride cymbals", synths: "groovy filtered chord stabs, rhythmic house-techno keys", vocals: "none", artistTag: "Carl Cox classic peak techno groove style" },
            benwal: { genre: "Bouncy Hardgroove", bpm: 140, key: "C minor", synthEngine: "square", drums: "hardgroove rolling kick drum, tribal percussion loops, driving ride cymbals", synths: "groovy filtered chord stabs, rhythmic house-techno keys", vocals: "none", artistTag: "Benwal bouncy hardgroove house style" },
            dvs1: { genre: "Raw Hypnotic Techno", bpm: 132, key: "D minor", synthEngine: "rumble", drums: "hardgroove rolling kick drum, tribal percussion loops, driving ride cymbals", synths: "hypnotic minor plucks, fast delayed synth riffs", vocals: "none", artistTag: "DVS1 deep rolling floor techno style" },
            partiboi69: { genre: "Bouncy Hardgroove", bpm: 145, key: "F minor", synthEngine: "square", drums: "bouncy euro-trance 909 kick, fast offbeat bassline, snappy snares", synths: "groovy filtered chord stabs, rhythmic house-techno keys", vocals: "dark robotic vocal chants, hypnotic spoken words", artistTag: "Partiboi69 ghetto funk 909 groove style" },
            klangkuenstler: { genre: "Schranz Hard Groove", bpm: 155, key: "F minor", synthEngine: "sawtooth", drums: "ultra distorted schranz kick, fast loop-percussion, aggressive noise hats", synths: "screaming TB-303 acid lead with resonance sweeps", vocals: "dark robotic vocal chants, hypnotic spoken words", artistTag: "Klangkuenstler 1990s Schranz Hard Techno style" },
            nicomoreno: { genre: "Hard Techno", bpm: 150, key: "A minor", synthEngine: "rumble", drums: "heavy distorted 909 kick drum, aggressive rolling sub-bass, fast offbeat hi-hats", synths: "dark dystopian supersaw stabs, detuned lead synths", vocals: "dark robotic vocal chants, hypnotic spoken words", artistTag: "Nico Moreno hard aggressive industrial techno style" },
            saralandry: { genre: "Hard Techno", bpm: 152, key: "D minor", synthEngine: "sawtooth", drums: "heavy distorted 909 kick drum, aggressive rolling sub-bass, fast offbeat hi-hats", synths: "screaming TB-303 acid lead with resonance sweeps", vocals: "hypnotic female whispered vocals, dark atmospheric phrases", artistTag: "Sara Landry high energy acid hard techno style" },
            russell: { genre: "Schranz Hard Groove", bpm: 158, key: "C minor", synthEngine: "sawtooth", drums: "ultra distorted schranz kick, fast loop-percussion, aggressive noise hats", synths: "screaming TB-303 acid lead with resonance sweeps", vocals: "none", artistTag: "Rush Pierre classic German loop Schranz style" },
            brakka: { genre: "Schranz Hard Groove", bpm: 165, key: "E minor", synthEngine: "fm", drums: "ultra distorted schranz kick, fast loop-percussion, aggressive noise hats", synths: "industrial metal percussion, distorted snare hits, anvil impacts", vocals: "dark robotic vocal chants, hypnotic spoken words", artistTag: "Brakka extreme hard Schranzcore style" }
        };

        function generateRandomTitle() {
            const w1 = ["Trance", "Schranz", "Rave", "Cyber", "Velocity", "Binary", "Ecstasy"];
            const w2 = ["Overdrive", "Pulse", "Pressure", "Anthem", "Distortion", "Core", "Delirium"];
            document.getElementById('trackTitle').value = `${w1[Math.floor(Math.random() * w1.length)]} ${w2[Math.floor(Math.random() * w2.length)]}`;
            generateRandomLyrics();
            generatePrompt();
        }

        function generateRandomLyrics() {
            const vocals = document.getElementById('vocals').value;
            if (vocals === "none") {
                document.getElementById('output-lyrics').innerText = getArrangementHeader() + "\n\n[Instrumental]";
                return;
            }
            const lang = document.getElementById('titleLang').value;
            const db = lyricDatabase[lang] || lyricDatabase.en;
            document.getElementById('output-lyrics').innerText = getArrangementHeader() + "\n" + db[Math.floor(Math.random() * db.length)];
        }

        function toggleArrangerBlock(el) {
            el.classList.toggle('active');
            generatePrompt();
            generateRandomLyrics();
        }

        function getArrangementHeader() {
            const activeBlocks = Array.from(document.querySelectorAll('.time-block.active')).map(b => b.innerText);
            return activeBlocks.join(' -> ');
        }

        function applyArtistPreset() {
            const key = document.getElementById('artistStyle').value;
            if (key === "custom" || !artistPresets[key]) return;
            const p = artistPresets[key];
            document.getElementById('genre').value = p.genre;
            document.getElementById('bpm').value = p.bpm;
            document.getElementById('key').value = p.key;
            document.getElementById('synthEngine').value = p.synthEngine;
            document.getElementById('drums').value = p.drums;
            document.getElementById('synths').value = p.synths;
            document.getElementById('vocals').value = p.vocals;
            updateBPM();
            generateRandomLyrics();
        }

        function updateBPM() {
            const val = document.getElementById('bpm').value;
            document.getElementById('bpmDisplay').innerText = val + ' BPM';
            generatePrompt();
            if(isPlaying) { stopAudio(); startAudio(); }
        }

        function generatePrompt() {
            const title = document.getElementById('trackTitle').value.trim();
            const ai = document.getElementById('targetAI').value;
            const artistKey = document.getElementById('artistStyle').value;
            const genre = document.getElementById('genre').value;
            const bpm = document.getElementById('bpm').value;
            const key = document.getElementById('key').value;
            const drums = document.getElementById('drums').value;
            const synths = document.getElementById('synths').value;
            const vocals = document.getElementById('vocals').value;
            const locationVibe = document.getElementById('locationVibe').value;
            const trackDuration = document.getElementById('trackDuration').value;

            let artistTag = (artistKey !== "custom" && artistPresets[artistKey]) ? `, ${artistPresets[artistKey].artistTag}` : "";
            let vocalText = vocals !== "none" ? `, ${vocals}` : "";
            let titlePrefix = title ? `Track Title: "${title}". ` : "";
            let arrText = ` Structural Flow: ${getArrangementHeader()}.`;

            let prompt = "";
            if (ai === "suno") {
                prompt = `${titlePrefix}${trackDuration}, designed for ${locationVibe}. ${bpm} BPM, ${genre}${artistTag}, ${key}, ${drums}, ${synths}${vocalText}, high quality club master.`;
            } else if (ai === "udio") {
                prompt = `${titlePrefix}Optimized for ${locationVibe}. A ${trackDuration} driving ${bpm} BPM ${genre} track in ${key}${artistTag}.${arrText} Features ${drums}. Prominent ${synths}${vocalText}.`;
            } else if (ai === "midjourney") {
                prompt = `Album cover art for a ${genre} track, intended for ${locationVibe}${artistTag}, dark dystopian techno club aesthetic, neon green and pitch black, cinematic lighting --ar 1:1`;
            }

            document.getElementById('output-style').innerText = prompt;
        }

        function randomizeAll() {
            document.getElementById('artistStyle').value = "custom";
            generateRandomTitle();
            const selects = ['genre', 'synthEngine', 'drums', 'synths', 'vocals', 'key', 'locationVibe', 'trackDuration'];
            selects.forEach(id => {
                const el = document.getElementById(id);
                el.selectedIndex = Math.floor(Math.random() * el.options.length);
            });
            document.getElementById('bpm').value = Math.floor(Math.random() * (175 - 130 + 1)) + 130;
            updateBPM();
        }

        function copyText(elementId, btn) {
            navigator.clipboard.writeText(document.getElementById(elementId).innerText);
            btn.innerText = "Kopiert!";
            btn.style.background = "#00ff66";
            btn.style.color = "#000";
            setTimeout(() => { btn.innerText = "Kopieren"; btn.style.background = "var(--accent)"; btn.style.color = "#fff"; }, 1500);
        }

        function exportMIDI() {
            const midiData = new Uint8Array([
                0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x60,
                0x4D, 0x54, 0x72, 0x6B, 0x00, 0x00, 0x00, 0x1B, 0x00, 0x90, 0x24, 0x64, 0x60, 0x80, 0x24, 0x00, 0x00, 0xFF, 0x2F, 0x00
            ]);
            const blob = new Blob([midiData], { type: "audio/midi" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${(document.getElementById('trackTitle').value || 'Techno_Beat').replace(/\s+/g, '_')}.mid`;
            a.click();
        }

        function toggleAudioPreview() {
            if (isPlaying) { stopAudio(); } else { startAudio(); }
        }

        function startAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            analyser.connect(audioCtx.destination);

            const bpm = parseInt(document.getElementById('bpm').value);
            const interval = ((60 / bpm) / 4) * 1000;
            stepIndex = 0;
            isPlaying = true;
            document.getElementById('audioBtn').innerText = "⏹️ Stop Audio";
            
            drawVisualizer();
            playStep();
            timerId = setInterval(playStep, interval);
        }

        function stopAudio() {
            if (timerId) clearInterval(timerId);
            if (audioCtx) audioCtx.close();
            isPlaying = false;
            document.getElementById('audioBtn').innerText = "▶️ Play Audio Beat";
        }

        function playStep() {
            if (!audioCtx) return;

            const currentStep = stepIndex % 16;

            if (currentStep % 4 === 0) {
                const kickOsc = audioCtx.createOscillator();
                const kickGain = audioCtx.createGain();
                kickOsc.frequency.setValueAtTime(140, audioCtx.currentTime);
                kickOsc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                kickGain.gain.setValueAtTime(1, audioCtx.currentTime);
                kickGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                kickOsc.connect(kickGain);
                kickGain.connect(analyser);
                kickOsc.start();
                kickOsc.stop(audioCtx.currentTime + 0.15);
            }

            if (currentStep % 4 === 2) {
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 7000;
                const hatGain = audioCtx.createGain();
                hatGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                hatGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                whiteNoise.connect(filter);
                filter.connect(hatGain);
                hatGain.connect(analyser);
                whiteNoise.start();
            }

            const engine = document.getElementById('synthEngine').value;
            const freq = acidNotes[currentStep];
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            if (engine === 'square') osc.type = 'square';
            else if (engine === 'trancelead') osc.type = 'sawtooth';
            else if (engine === 'moog' || engine === 'rumble') osc.type = 'triangle';
            else osc.type = 'sawtooth';

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            filter.type = 'lowpass';
            filter.Q.value = engine === 'rumble' ? 2 : 12;
            filter.frequency.setValueAtTime(180, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(engine === 'rumble' ? 600 : 2500, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(analyser);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);

            stepIndex++;
        }

        function drawVisualizer() {
            canvas = document.getElementById('visualizer');
            canvasCtx = canvas.getContext('2d');
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function render() {
                if (!isPlaying) return;
                requestAnimationFrame(render);
                analyser.getByteFrequencyData(dataArray);

                canvasCtx.fillStyle = '#000';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / dataArray.length) * 2.5;
                let x = 0;

                for (let i = 0; i < dataArray.length; i++) {
                    const barHeight = dataArray[i] / 5;
                    canvasCtx.fillStyle = '#00ff66';
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 2;
                }
            }
            render();
        }

        generateRandomTitle();
    </script>
